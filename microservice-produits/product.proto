syntax = "proto3";

package product;

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
  string category = 5;
  string photo = 6;
}

// Requests

message CreateProductRequest {
  Product product = 1;
}
message GetProductRequest {
  string id = 1;
}


message UpdateProductRequest {
  Product product = 1;
}

message DeleteProductRequest {
  string id = 1;
}
message ListProductsRequest {}

message SearchProductByNameRequest {
  string name = 1;
}

message GetProducstByCategoryRequest {
  string category = 1;
}


message GetProductsOutOfStockRequest {}

// Responses

message CreateProductResponse {
  Product product = 1;
}

message GetProductResponse {
  Product product = 1;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductResponse {
  bool success = 1;
}

message ListProductsResponse {
  repeated Product products = 1;
}
message SearchProductByNameResponse {
  repeated Product products = 1;
}

message GetProducstByCategoryResponse {
  repeated Product products = 1;
}



message GetProductsOutOfStockResponse {
  repeated Product products = 1;
}


// Service
service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc SearchProductByName (SearchProductByNameRequest) returns (SearchProductByNameResponse);
  rpc GetProductsByCategory (GetProducstByCategoryRequest) returns (GetProducstByCategoryResponse);
  rpc GetProductsOutOfStock (GetProductsOutOfStockRequest) returns (GetProductsOutOfStockResponse);
}   
